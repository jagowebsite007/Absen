<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Absensi Sekolah Rajawali (GitHub Pages Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #030712;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.12) 0%, transparent 45%);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 8px;
    }

    .app-viewport {
      width: 100%;
      max-width: 450px;
      min-height: 90vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.12);
      overflow: hidden;
    }

    .top-panel {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
      padding: 36px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pattern-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.12;
      pointer-events: none;
    }

    .logo-badge {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px -6px rgba(99, 102, 241, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      z-index: 2;
      overflow: hidden;
      padding: 6px;
    }

    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .main-panel {
      background: rgba(15, 23, 42, 0.95);
      flex: 1;
      border-radius: 28px 28px 0 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      z-index: 2;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .title-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .title-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .title-header p {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .config-box {
      background: rgba(99, 102, 241, 0.1);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 11px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-control:focus {
      background-color: rgba(30, 41, 59, 0.95);
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.06);
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .bento-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .clock-widget {
      text-align: center;
      margin-bottom: 14px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 14px;
      padding: 10px;
    }

    .clock-title {
      font-size: 10px;
      font-weight: 700;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .clock-time {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      font-family: monospace;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .camera-box {
      width: 100%;
      height: 230px;
      background-color: #090d16;
      border-radius: 18px;
      border: 1px dashed rgba(99, 102, 241, 0.4);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .camera-box video, .camera-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      text-align: center;
      max-width: 90%;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }

    /* Style Tambahan untuk Panel Admin & Tabel */
    .admin-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-tab {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #9ca3af;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-tab.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border-color: transparent;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 8px;
      border-radius: 14px;
      text-align: center;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #818cf8;
    }
    .stat-label {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      max-height: 280px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: left;
    }
    .data-table th {
      background: rgba(15, 23, 42, 0.9);
      color: #818cf8;
      padding: 10px;
      position: sticky;
      top: 0;
      font-weight: 700;
    }
    .data-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #e5e7eb;
      white-space: nowrap;
    }
    .data-table tr:hover {
      background: rgba(99, 102, 241, 0.08);
    }

    .btn-download {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: 700;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-viewport">
  <div class="top-panel">
    <div class="logo-badge">
      <!-- Direct Link Gambar Google Drive dengan fallback emoji jika gambar belum public -->
      <img src="https://lh3.googleusercontent.com/d/1MDdU25_BOLuzms2vHStf8mUn9fYiNcWj" alt="Logo Rajawali" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='block';">
      <span id="fallbackLogo" style="font-size: 28px; display: none;">🏫</span>
    </div>
  </div>

  <div class="main-panel">
    
    <!-- URL GAS API Config -->
    <div class="config-box">
      <label style="color:#818cf8; font-weight:bold;">GAS API WebApp URL:</label>
      <input type="text" id="gasApiUrl" class="form-control" style="font-size:10px; margin-top:4px;" placeholder="https://script.google.com/macros/s/.../exec">
    </div>

    <!-- 1. LOGIN -->
    <div id="viewLogin">
      <div class="title-header">
        <h1>Absensi Rajawali</h1>
        <p>Akses Kamera Langsung dari GitHub Pages</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Nama Pengguna</label>
          <input type="text" id="loginNama" class="form-control" placeholder="Masukkan Nama" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">Masuk Akun</button>
      </form>
    </div>

    <!-- 2. USER DASHBOARD -->
    <div id="viewUserDashboard" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div>
          <h2 id="userGreeting" style="font-size: 18px; font-weight: 800;">Hai, User</h2>
          <span id="userRoleBadge" class="badge-status badge-green">Guru</span>
        </div>
        <button onclick="logout()" class="btn-secondary">Keluar</button>
      </div>

      <!-- Tab Navigasi Admin (Hanya muncul jika Role = Admin / Kepala Sekolah) -->
      <div id="adminNavTab" class="admin-nav hidden">
        <button id="btnTabSelfie" onclick="switchTab('selfie')" class="btn-tab active">📷 Absen Selfie</button>
        <button id="btnTabAdmin" onclick="switchTab('admin')" class="btn-tab">📊 Rekap & Filter Admin</button>
      </div>

      <!-- TAB 1: Live Clock & Camera Selfie -->
      <div id="sectionSelfie">
        <div class="bento-card">
          <div class="clock-widget">
            <div class="clock-title">Waktu Real-Time (WIT)</div>
            <div id="liveClockDisplay" class="clock-time">--:--:-- WIT</div>
          </div>

          <div class="camera-box">
            <video id="webcam" autoplay playsinline muted></video>
            <img id="selfiePreview" src="" class="hidden">
          </div>

          <div style="display: flex; gap: 6px; margin-bottom: 10px;">
            <button type="button" onclick="startCamera()" class="btn-secondary" style="flex: 1;">📷 Aktifkan Kamera</button>
            <button type="button" onclick="takeSnap()" class="btn-secondary" style="flex: 1; background: rgba(99,102,241,0.2); color: #818cf8;">📸 Ambil Selfie</button>
          </div>

          <div style="font-size: 11px; color: #9ca3af; margin-bottom: 12px;">
            <strong>GPS:</strong> <span id="gpsStatus">Mendeteksi...</span>
          </div>

          <div style="display: flex; gap: 8px;">
            <button onclick="doAttendance('Check-In')" class="btn-primary" style="flex: 1;">Check-In</button>
            <button onclick="doAttendance('Check-Out')" class="btn-primary" style="flex: 1; background: #334155;">Check-Out</button>
          </div>
        </div>
      </div>

      <!-- TAB 2: PANEL REKAP ADMIN -->
      <div id="sectionAdmin" class="hidden">
        <div class="bento-card">
          <h3 style="font-size: 14px; font-weight: 800; margin-bottom: 12px; color: #818cf8;">🔍 Filter Kehadiran Guru & Staf</h3>
          
          <div class="filter-grid">
            <div>
              <label style="font-size: 10px; color: #9ca3af; display: block; margin-bottom: 4px;">Dari Tanggal</label>
              <input type="date" id="filterStartDate" class="form-control" style="padding: 8px;" onchange="applyAdminFilter()">
            </div>
            <div>
              <label style="font-size: 10px; color: #9ca3af; display: block; margin-bottom: 4px;">Sampai Tanggal</label>
              <input type="date" id="filterEndDate" class="form-control" style="padding: 8px;" onchange="applyAdminFilter()">
            </div>
          </div>

          <div class="filter-grid">
            <div>
              <label style="font-size: 10px; color: #9ca3af; display: block; margin-bottom: 4px;">Nama Pengguna</label>
              <select id="filterNama" class="form-control" style="padding: 8px;" onchange="applyAdminFilter()">
                <option value="ALL">Semua Nama</option>
              </select>
            </div>
            <div>
              <label style="font-size: 10px; color: #9ca3af; display: block; margin-bottom: 4px;">Tipe Absen</label>
              <select id="filterTipe" class="form-control" style="padding: 8px;" onchange="applyAdminFilter()">
                <option value="ALL">Semua Tipe</option>
                <option value="Check-In">Check-In</option>
                <option value="Check-Out">Check-Out</option>
              </select>
            </div>
          </div>

          <!-- Summary Stats -->
          <div class="stat-card-grid">
            <div class="stat-card">
              <div id="statTotal" class="stat-value">0</div>
              <div class="stat-label">Total Absen</div>
            </div>
            <div class="stat-card">
              <div id="statCheckIn" class="stat-value" style="color: #34d399;">0</div>
              <div class="stat-label">Check-In</div>
            </div>
            <div class="stat-card">
              <div id="statCheckOut" class="stat-value" style="color: #f43f5e;">0</div>
              <div class="stat-label">Check-Out</div>
            </div>
          </div>

          <!-- Tabel Data Absensi -->
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Waktu (WIT)</th>
                  <th>Nama</th>
                  <th>Tipe</th>
                  <th>Foto</th>
                </tr>
              </thead>
              <tbody id="adminTableBody">
                <tr>
                  <td colspan="4" style="text-align: center; color: #9ca3af;">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Tombol Download CSV -->
          <button onclick="downloadCsvReport()" class="btn-download">
            📥 Download Laporan Kehadiran (CSV/Excel)
          </button>
        </div>
      </div>

    </div>

  </div>
</div>

<div id="toast" class="toast">Notifikasi...</div>

<script>
  var currentUser = null;
  var currentCoords = "";
  var selfieData = "";
  var mediaStreamTrack = null;
  var rawAttendanceData = [];
  var filteredAttendanceData = [];

  // Load URL API dari localStorage jika tersimpan
  window.onload = function() {
    var savedUrl = localStorage.getItem('gas_api_url');
    if (savedUrl) document.getElementById('gasApiUrl').value = savedUrl;
    initGeolocation();
    initClock();
  };

  function getApiUrl() {
    var url = document.getElementById('gasApiUrl').value.trim();
    if (url) localStorage.setItem('gas_api_url', url);
    return url;
  }

  function initClock() {
    setInterval(function() {
      var d = new Date();
      document.getElementById('liveClockDisplay').innerText = d.toLocaleTimeString('id-ID') + " WIT";
    }, 1000);
  }

  function initGeolocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        currentCoords = pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
        document.getElementById('gpsStatus').innerText = "Terkunci (" + currentCoords + ")";
      }, function() {
        document.getElementById('gpsStatus').innerText = "Gagal mengambil GPS";
      });
    }
  }

  /* Kamera Langsung dari GitHub Pages */
  function startCamera() {
    var video = document.getElementById('webcam');
    video.classList.remove('hidden');
    document.getElementById('selfiePreview').classList.add('hidden');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
        .then(function(stream) {
          mediaStreamTrack = stream;
          video.srcObject = stream;
          showToast("Kamera Berhasil Diaktifkan!");
        })
        .catch(function(err) {
          showToast("Kamera gagal dibuka: " + err.message);
        });
    } else {
      showToast("Browser tidak mendukung WebRTC Kamera.");
    }
  }

  function takeSnap() {
    var video = document.getElementById('webcam');
    if (video.videoWidth === 0) {
      showToast("Buka kamera terlebih dahulu!");
      return;
    }
    var canvas = document.createElement('canvas');
    canvas.width = 300;
    canvas.height = 300;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, 300, 300);
    selfieData = canvas.toDataURL('image/jpeg', 0.85);

    var img = document.getElementById('selfiePreview');
    img.src = selfieData;
    img.classList.remove('hidden');
    video.classList.add('hidden');

    if (mediaStreamTrack) {
      mediaStreamTrack.getTracks().forEach(function(t) { t.stop(); });
    }
    showToast("Foto selfie berhasil diambil!");
  }

  /* API Communication via Fetch (CORS Direct to GAS) */
  function callGasApi(action, payload, callback) {
    var apiUrl = getApiUrl();
    if (!apiUrl) {
      showToast("Masukkan URL Apps Script Web App terlebih dahulu!");
      return;
    }

    showToast("Memproses...");
    fetch(apiUrl, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: action, payload: payload })
    })
    .then(res => res.json())
    .then(data => callback(data))
    .catch(err => showToast("Error API: " + err.message));
  }

  function handleLogin(e) {
    e.preventDefault();
    var nama = document.getElementById('loginNama').value;
    var pass = document.getElementById('loginPass').value;

    callGasApi("login", { nama: nama, pass: pass }, function(res) {
      if (res.success) {
        currentUser = res.user;
        document.getElementById('viewLogin').classList.add('hidden');
        document.getElementById('viewUserDashboard').classList.remove('hidden');
        document.getElementById('userGreeting').innerText = "Hai, " + currentUser.nama;
        
        var userRole = currentUser.role || "Guru";
        document.getElementById('userRoleBadge').innerText = userRole;

        // Cek jika user adalah Admin / Kepala Sekolah
        var isAdmin = userRole.toLowerCase().includes("admin") || userRole.toLowerCase().includes("kepala");
        if (isAdmin) {
          document.getElementById('userRoleBadge').className = "badge-status badge-purple";
          document.getElementById('adminNavTab').classList.remove('hidden');
          loadAdminData(); // Pre-load data rekap
        } else {
          document.getElementById('userRoleBadge').className = "badge-status badge-green";
          document.getElementById('adminNavTab').classList.add('hidden');
        }

        showToast("Login Berhasil!");
        startCamera();
      } else {
        showToast(res.message || "Login Gagal!");
      }
    });
  }

  /* Switch Tab antara Selfie & Panel Admin */
  function switchTab(tab) {
    var btnSelfie = document.getElementById('btnTabSelfie');
    var btnAdmin = document.getElementById('btnTabAdmin');
    var secSelfie = document.getElementById('sectionSelfie');
    var secAdmin = document.getElementById('sectionAdmin');

    if (tab === 'selfie') {
      btnSelfie.classList.add('active');
      btnAdmin.classList.remove('active');
      secSelfie.classList.remove('hidden');
      secAdmin.classList.add('hidden');
      startCamera();
    } else {
      btnAdmin.classList.add('active');
      btnSelfie.classList.remove('active');
      secAdmin.classList.remove('hidden');
      secSelfie.classList.add('hidden');
      if (mediaStreamTrack) {
        mediaStreamTrack.getTracks().forEach(function(t) { t.stop(); });
      }
      loadAdminData();
    }
  }

  /* Fungsi Admin: Ambil Data Absensi */
  function loadAdminData() {
    callGasApi("getAttendanceData", {}, function(res) {
      if (res.success) {
        rawAttendanceData = res.data || [];
        populateNamaDropdown(rawAttendanceData);
        applyAdminFilter();
        showToast("Data Rekap Diperbarui!");
      } else {
        showToast(res.message || "Gagal memuat rekap");
      }
    });
  }

  /* Isikan Dropdown Nama Guru secara Otomatis */
  function populateNamaDropdown(data) {
    var selectNama = document.getElementById('filterNama');
    var uniqueNames = [];
    data.forEach(function(item) {
      if (item.nama && !uniqueNames.includes(item.nama)) {
        uniqueNames.push(item.nama);
      }
    });

    var currentSelected = selectNama.value;
    selectNama.innerHTML = '<option value="ALL">Semua Nama</option>';
    uniqueNames.forEach(function(nama) {
      var opt = document.createElement('option');
      opt.value = nama;
      opt.innerText = nama;
      selectNama.appendChild(opt);
    });
    selectNama.value = currentSelected || "ALL";
  }

  /* Filter Data Kehadiran berdasarkan Input Admin */
  function applyAdminFilter() {
    var startDate = document.getElementById('filterStartDate').value;
    var endDate = document.getElementById('filterEndDate').value;
    var selectedNama = document.getElementById('filterNama').value;
    var selectedTipe = document.getElementById('filterTipe').value;

    filteredAttendanceData = rawAttendanceData.filter(function(row) {
      var matchDate = true;
      var matchNama = true;
      var matchTipe = true;

      // Extract Tanggal YYYY-MM-DD dari string waktu "YYYY-MM-DD HH:mm:ss"
      var rowDateStr = row.waktu ? row.waktu.split(" ")[0] : "";

      if (startDate && rowDateStr < startDate) matchDate = false;
      if (endDate && rowDateStr > endDate) matchDate = false;
      if (selectedNama !== "ALL" && row.nama !== selectedNama) matchNama = false;
      if (selectedTipe !== "ALL" && row.tipe !== selectedTipe) matchTipe = false;

      return matchDate && matchNama && matchTipe;
    });

    renderAdminTable(filteredAttendanceData);
  }

  /* Tampilkan Data ke Tabel HTML & Hitung Ringkasan */
  function renderAdminTable(data) {
    var tbody = document.getElementById('adminTableBody');
    tbody.innerHTML = "";

    var countCheckIn = 0;
    var countCheckOut = 0;

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #9ca3af;">Tidak ada data sesuai filter.</td></tr>';
    } else {
      data.forEach(function(row) {
        if (row.tipe === "Check-In") countCheckIn++;
        if (row.tipe === "Check-Out") countCheckOut++;

        var tr = document.createElement('tr');
        var fotoCell = row.fotoUrl && row.fotoUrl.startsWith("http")
          ? `<a href="${row.fotoUrl}" target="_blank" style="color: #818cf8; text-decoration: underline;">Lihat Foto</a>`
          : `-`;

        tr.innerHTML = `
          <td>${row.waktu}</td>
          <td><strong>${row.nama}</strong></td>
          <td><span class="badge-status ${row.tipe === 'Check-In' ? 'badge-green' : 'badge-purple'}">${row.tipe}</span></td>
          <td>${fotoCell}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('statTotal').innerText = data.length;
    document.getElementById('statCheckIn').innerText = countCheckIn;
    document.getElementById('statCheckOut').innerText = countCheckOut;
  }

  /* Export / Download Data Kehadiran ke File CSV (Bisa Dibuka di Excel) */
  function downloadCsvReport() {
    if (filteredAttendanceData.length === 0) {
      showToast("Tidak ada data untuk diunduh!");
      return;
    }

    var csvRows = [];
    // Header CSV
    csvRows.push(["Tanggal & Waktu (WIT)", "Nama Pengguna", "Tipe Absen", "Koordinat GPS", "Link Foto Drive"]);

    // Baris Data
    filteredAttendanceData.forEach(function(row) {
      csvRows.push([
        `"${row.waktu}"`,
        `"${row.nama}"`,
        `"${row.tipe}"`,
        `"${row.gps}"`,
        `"${row.fotoUrl}"`
      ]);
    });

    var csvContent = "\uFEFF" + csvRows.map(e => e.join(",")).join("\n");
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    
    var a = document.createElement('a');
    var filename = "Rekap_Kehadiran_Rajawali_" + new Date().toISOString().slice(0, 10) + ".csv";
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    showToast("File Laporan Kehadiran Berhasil Diunduh!");
  }

  function doAttendance(tipe) {
    if (!selfieData) {
      showToast("Ambil foto selfie terlebih dahulu!");
      return;
    }
    callGasApi("submitAttendance", {
      userId: currentUser.id,
      tipe: tipe,
      selfieData: selfieData,
      coords: currentCoords
    }, function(res) {
      showToast(res.message);
    });
  }

  function logout() {
    currentUser = null;
    document.getElementById('viewUserDashboard').classList.add('hidden');
    document.getElementById('viewLogin').classList.remove('hidden');
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(function() { toast.style.display = 'none'; }, 3500);
  }
</script>
